# ml4em configuration template.
# Copy to config.yaml and edit. Only include keys that differ from defaults.
#
# NEVER put tokens here. Use environment variables or a .env file:
#   ML4EM_ZTF_TOKEN=your_kowalski_token

sources:
  ztf:
    host: gloria.caltech.edu
    port: 443
    timeout: 300
    collection_sources: ZTF_sources_20240515   # DR20 source catalog on gloria
    max_timestamp_hjd: 2459951.5   # end of ZTF DR16; null = all data
    bands: [g, r, i]
    # 5 minutes.  30 min (scope-ml's library default) would discard every pair
    # of epochs closer together than half an hour, which is the regime short-
    # period WDBs live in and is incompatible with min_period_days: 0.003472.
    min_cadence_days: 0.003472     # 5 minutes

features:
  min_observations: 50
  compute_dmdt: true

  period:
    algorithms: [CE, AOV, LS, MHF, FPW]
    # 5 minutes, matching the reference WDB production run (--max-freq 288).
    # A coarser floor excludes the ultracompact binaries this pipeline exists
    # to find, and contradicts the 5-minute min_cadence_days above.
    min_period_days: 0.003472
    max_period_days: 10.0
    top_n_periods: 10
    min_agreement: 2

  # dm/dt bin edges are non-uniform by design — see DMDT_DT_EDGES /
  # DMDT_DM_EDGES in src/ml4em/constants.py.  Omit these keys to use the
  # reference binning; override only if you are training from scratch, since
  # changing them invalidates every previously computed histogram.
  # dmdt:
  #   dt_edges: [0.0, 0.02759, ...]
  #   dm_edges: [-8.0, -4.5, ...]

  catalog:
    xmatch_radius_arcsec: 2.0
    include_gaia: true

storage:
  # Input files — place in ml4em/data/ locally (gitignored).
  # Override with absolute paths on MSI.
  catalog_path: data/wdb_sources.csv   # ra/dec catalog of target sources
  labels_path:  data/labels.csv        # you supply this; see docs/guides/label-preparation.md

  # Output directories
  features_dir:    features
  models_dir:      models
  predictions_dir: predictions

training:
  batch_size: 64
  learning_rate: 3.0e-4
  max_epochs: 100
  patience: 20
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

inference:
  model_path: null   # null = latest model in storage.models_dir
  batch_size: 10000
  confidence_thresholds:
    high:   0.9
    medium: 0.7
